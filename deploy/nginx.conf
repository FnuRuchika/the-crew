# THE CREW: Nginx site (HTTP, any hostname / IP). No secrets.
#
# Install:  sudo cp /opt/the-crew/deploy/nginx.conf /etc/nginx/sites-available/the-crew
#           sudo ln -sf /etc/nginx/sites-available/the-crew /etc/nginx/sites-enabled/the-crew
#           sudo rm -f /etc/nginx/sites-enabled/default
#           sudo nginx -t && sudo systemctl reload nginx
#
#   /       → React production build in /opt/the-crew/dist (SPA fallback to index.html)
#   /api/   → FastAPI on 127.0.0.1:8000 (never exposed publicly)
#
# HTTPS later: set server_name to the real domain, then run certbot --nginx (see DEPLOYMENT.md).
# The browser microphone (LIVE CALL → START MIC) only works over HTTPS; demo audio works on HTTP.

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;  # replace with your domain (e.g. example.com www.example.com) before certbot

    root /opt/the-crew/dist;
    index index.html;

    server_tokens off;
    charset utf-8;

    # Safe defaults. Inherited by every location below that doesn't declare its own add_header.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "microphone=(self), camera=(), geolocation=()" always;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # ── API → FastAPI ───────────────────────────────────────────
    location /api/ {
        proxy_pass http://127.0.0.1:8000;  # no trailing slash: keeps the /api prefix FastAPI expects
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Overwrite (not append): Nginx is the only edge, so clients can't spoof their IP
        # to dodge the backend's per-IP rate limits.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        # LIVE CALL uploads one recorded segment per request; the backend caps audio at 10 MB.
        client_max_body_size 12m;

        # Gemini (12 s × primary + fallback model) and ElevenLabs TTS/STT (20 s × model chain)
        # can legitimately take a while. Browser-side timeouts are 30 s (analyze) / 45 s (STT).
        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 90s;
    }

    # ── Static frontend ─────────────────────────────────────────
    # Vite fingerprints everything in /assets, so it can be cached for a long time.
    location /assets/ {
        expires 1y;
        access_log off;
        try_files $uri =404;
    }

    # index.html must never be cached, or users keep old asset hashes after a deploy.
    location = /index.html {
        expires -1;
    }

    # SPA fallback (the app routes with #hashes today; this keeps deep links safe if that changes).
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Never serve dotfiles, but leave ACME challenges reachable for certbot.
    location ~ /\.(?!well-known/) {
        deny all;
    }
}
